packages:
  - app
  - docs

overrides:
  # fontless (via @nuxt/fonts) still pins a vulnerable esbuild (GHSA-g7r4-m6w7-qqqr).
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'

patchedDependencies:
  # Swipe toasts right to dismiss while they stay on the left (swipe direction is hardwired to position).
  '@nuxt/ui@4.11.2': patches/@nuxt__ui@4.11.2.patch

allowBuilds:
  '@journeyapps/wa-sqlite': true
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
